<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Football — Mode Carrière</title><style>body{margin:0;background:#07130c;color:#fff;font-family:Arial}.wrap{max-width:1050px;margin:auto;padding:25px}.panel{background:#12261a;border:1px solid #376b45;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{font-size:24px;font-weight:bold}.muted{opacity:.7}.btn{background:#1d6031;color:white;border:1px solid #62b779;border-radius:9px;padding:11px 16px;cursor:pointer;margin:4px}.match{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #24452d}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #24452d;text-align:left}.next{border:1px solid #62b779;border-radius:10px;padding:12px}</style></head><body><div class="wrap"><h1>📈 HB FOOTBALL — CARRIÈRE</h1><div class="panel"><h2>🏟️ <span id="club"></span></h2><div class="muted" id="season"></div><button class="btn" onclick="newSeason()">🚀 Nouvelle saison</button><button class="btn" onclick="location.href='transfers.html'">💰 Transferts</button><button class="btn" onclick="location.href='squad.html'">👥 Mon effectif</button></div><div class="grid"><div class="panel"><div class="muted">💰 Budget</div><div class="stat" id="budget"></div></div><div class="panel"><div class="muted">⭐ Réputation</div><div class="stat" id="rep"></div></div><div class="panel"><div class="muted">🏆 Victoires</div><div class="stat" id="wins"></div></div><div class="panel"><div class="muted">📊 Points</div><div class="stat" id="points"></div></div></div><div class="panel"><h2>⚽ Prochain match</h2><div id="next" class="next"></div><button class="btn" onclick="playNext()">⚽ Jouer le match</button></div><div class="panel"><h2>📅 Calendrier</h2><div id="calendar"></div></div><div class="panel"><h2>🏆 Classement</h2><table class="table"><thead><tr><th>#</th><th>Équipe</th><th>Pts</th></tr></thead><tbody id="standings"></tbody></table></div><div class="panel"><button class="btn" onclick="location.href='index.html'">🏠 Menu</button><button class="btn" onclick="location.href='team-selection.html'">🏆 Équipes</button></div></div><script>const opponents=['Atlas FC','Ocean FC','Casablanca Stars','Rabat Royals','Marrakech Lions','Tangier Waves','Fes Warriors','Agadir Eagles'];let career=JSON.parse(localStorage.getItem('hb_career')||'null');if(!career)career={club:localStorage.getItem('hb_selected_team')||'HB United',season:1,budget:10000000,rep:50,wins:0,draws:0,losses:0,points:0,played:0,started:false,owned:[]};career.owned=career.owned||[];function save(){localStorage.setItem('hb_career',JSON.stringify(career))}function render(){club.textContent=career.club;season.textContent='Saison '+career.season+' · Journée '+(career.played+1)+' / '+opponents.length;budget.textContent='€'+(career.budget/1000000).toFixed(1)+'M';rep.textContent=career.rep;wins.textContent=career.wins;points.textContent=career.points;let opp=opponents[career.played%opponents.length];next.innerHTML='<b>'+career.club+'</b> 🆚 <b>'+opp+'</b>';calendar.innerHTML=opponents.map((o,i)=>'<div class="match"><span>J'+(i+1)+' · '+career.club+' 🆚 '+o+'</span><b>'+(i<career.played?'TERMINÉ':'À JOUER')+'</b></div>').join('');let rows=[career.club,...opponents].map((name,i)=>({name,pts:name===career.club?career.points:Math.max(0,12-i*2+career.played)})).sort((a,b)=>b.pts-a.pts);standings.innerHTML=rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.pts+'</td></tr>').join('')}function newSeason(){career.season++;career.played=0;career.wins=0;career.draws=0;career.losses=0;career.points=0;career.rep=Math.min(100,career.rep+2);career.started=true;save();render();alert('🚀 Saison '+career.season+' commencée !')}function playNext(){if(!career.started){career.started=true;save()}localStorage.setItem('hb_career_match','1');location.href='index.html'}render();</script></body></html>
