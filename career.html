<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Football — Mode Carrière</title><style>body{margin:0;background:#07130c;color:#fff;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:30px}h1{text-align:center;font-size:44px}.panel{background:#12261a;border:1px solid #376b45;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{font-size:25px;font-weight:bold}.btn{background:#1d6031;color:white;border:1px solid #62b779;border-radius:9px;padding:12px 18px;cursor:pointer;margin:5px}.muted{opacity:.75}.ok{font-size:18px}</style></head><body><div class="wrap"><h1>📈 HB FOOTBALL — CARRIÈRE</h1><div class="panel"><h2>🏟️ Ton club</h2><div id="club"></div><button class="btn" onclick="newSeason()">🚀 Commencer la saison</button></div><div class="grid"><div class="panel"><div class="muted">Budget</div><div class="stat" id="budget">€10M</div></div><div class="panel"><div class="muted">Réputation</div><div class="stat" id="rep">50</div></div><div class="panel"><div class="muted">Victoires</div><div class="stat" id="wins">0</div></div><div class="panel"><div class="muted">Points</div><div class="stat" id="points">0</div></div></div><div class="panel"><h2>📅 Calendrier</h2><div id="calendar" class="ok">Saison non commencée.</div></div><div class="panel"><h2>👥 Gestion</h2><button class="btn" onclick="alert('Effectif : entraîneur, titulaires, remplaçants et progression seront ajoutés ici.')">👤 Effectif</button><button class="btn" onclick="alert('Marché des transferts : bientôt disponible.')">💰 Transferts</button><button class="btn" onclick="location.href='index.html'">⚽ Jouer un match</button></div></div><script>let career=JSON.parse(localStorage.getItem('hb_career')||'null');if(!career){career={club:'HB United',season:1,budget:10000000,rep:50,wins:0,points:0,started:false}}function render(){club.innerHTML='<b>'+career.club+'</b><div class="muted">Saison '+career.season+'</div>';budget.textContent='€'+(career.budget/1000000).toFixed(1)+'M';rep.textContent=career.rep;wins.textContent=career.wins;points.textContent=career.points;calendar.innerHTML=career.started?'J1 : Atlas FC<br>J2 : Ocean FC<br>J3 : Casablanca Stars<br>J4 : Rabat Royals':'Saison non commencée.'}function newSeason(){career.started=true;career.season++;career.wins=0;career.points=0;career.rep=Math.min(100,career.rep+2);localStorage.setItem('hb_career',JSON.stringify(career));render();alert('🚀 Nouvelle saison commencée !')}render();</script></body></html>
