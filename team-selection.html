<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Football — Équipes</title><style>body{margin:0;background:#07130c;color:#fff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:30px}h1{text-align:center;font-size:46px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#12261a;border:1px solid #376b45;border-radius:14px;padding:18px;cursor:pointer}.card:hover{transform:translateY(-2px);background:#1a3a25}.players{margin-top:8px;font-size:14px;opacity:.85}.rating{font-size:20px}.actions{text-align:center;margin:25px}.btn{background:#1d6031;color:white;border:0;border-radius:9px;padding:13px 20px;cursor:pointer}.hidden{display:none}.line{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #24452d}</style></head><body><div class="wrap"><h1>🏆 HB FOOTBALL</h1><h2>Choisis ton équipe</h2><div id="teams" class="grid"></div><section id="details" class="hidden"><h2 id="title"></h2><div id="squad"></div><div class="actions"><button class="btn" onclick="alert('Prochaine étape : lancer un match avec cette composition !')">⚽ Jouer avec cette équipe</button></div></section></div><script>const teams=[['HB United','#32a8ff',['Yanis Bensaid','Adam El Mansouri','Ilyas Rahmani','Nabil Kaddouri','Sami Amrani','Omar Belkacem','Rayan Haddad','Ismail Azzouzi','Anas El Fassi','Youssef Karim','Mehdi Saidi']],['Atlas FC','#ef4d55',['Kamal Idrissi','Bilal Nouri','Walid Chafai','Amine Tazi','Hamza Rami','Zakaria Fathi','Ayoub Mernissi','Soufiane Jaber','Hicham Arif','Karim Boulahya','Samir Fahmi']],['Ocean FC','#24b58a',['Nassim Kacem','Ibrahim Saad','Moussa Tahiri','Bilal Fares','Sofiane Ait Ali','Ayoub Lahlou','Rachid Ziani','Imad Cherkaoui','Noureddine Berrada','Hamza Ghali','Othmane Lamine']],['Casablanca Stars','#f2c94c'],['Rabat Royals','#7b61ff'],['Marrakech Lions','#ff7a45'],['Tangier Waves','#20c4d9'],['Fes Warriors','#9b51e0'],['Agadir Eagles','#27ae60'],['Desert FC','#d98b30'],['Capital United','#eb5757'],['Mountain FC','#6fcf97'],['Thunder FC','#2f80ed'],['Phoenix FC','#f2994a'],['Royal Athletic','#bb6bd9']];const box=document.getElementById('teams');teams.forEach((t,i)=>{const d=document.createElement('div');d.className='card';d.style.borderColor=t[1];d.innerHTML='<h3>'+t[0]+'</h3><div class="rating">⭐ '+(78+i%9)+'</div><div class="players">'+(t[2]?t[2].length+' joueurs disponibles':'Effectif à compléter')+'</div>';d.onclick=()=>show(i);box.appendChild(d)});function show(i){const t=teams[i];title.textContent='👤 '+t[0]+' — Effectif';squad.innerHTML=(t[2]||Array.from({length:11},(_,n)=>'Joueur '+(n+1))).map((p,n)=>'<div class="line"><span>#'+(n+1)+' '+p+'</span><b>⭐ '+(72+(n+i)%17)+'</b></div>').join('');details.classList.remove('hidden');details.scrollIntoView({behavior:'smooth'})}</script></body></html>
