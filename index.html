<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HB Football 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07110a;font-family:Arial;color:#fff}
#menu{position:fixed;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#174d2b,#050906)}
h1{font-size:64px;letter-spacing:6px;margin:0 0 8px}.sub{opacity:.75;margin-bottom:20px}
.btn{background:#164b29;color:#fff;border:1px solid #62b779;border-radius:10px;padding:13px 22px;margin:5px;font-size:16px;cursor:pointer}.btn:hover{background:#216b39}
#hud{position:fixed;z-index:8;top:15px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#07110dcc;border-radius:10px;font-weight:bold}
#pause{position:fixed;z-index:9;right:15px;top:15px}.hidden{display:none!important}
#help{position:fixed;z-index:8;bottom:14px;left:50%;transform:translateX(-50%);background:#07110dcc;padding:9px 15px;border-radius:8px;font-size:13px}
#staminaBox{position:fixed;z-index:8;left:18px;bottom:18px;width:230px;background:#07110dcc;border-radius:10px;padding:10px 12px;box-sizing:border-box}
#staminaLabel{font-size:13px;margin-bottom:5px}#staminaBar{height:12px;background:#29352c;border-radius:8px;overflow:hidden;border:1px solid #ffffff66}#staminaFill{height:100%;width:100%;background:#43d36b;transition:width .15s linear}
#minimap{position:fixed;z-index:8;right:18px;bottom:18px;width:230px;height:140px;background:#16813a;border:3px solid #fff;border-radius:10px;box-shadow:0 4px 18px #0008}
.half{position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #ffffff99}.box{position:absolute;top:35px;width:28px;height:70px;border:1px solid #ffffffaa}.dot{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 2px #000}.blue{background:#39a9ff}.red{background:#ff4d55}.white{background:#fff}
#subMenu{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);background:#10251a;border:1px solid #62b779;border-radius:14px;padding:20px;min-width:320px;max-height:80vh;overflow:auto}.playerRow{padding:10px;border-bottom:1px solid #315c3c;cursor:pointer}.playerRow:hover{background:#1d6031}
</style>
</head>
<body>
<div id="menu">
<h1>HB FOOTBALL</h1><div id="selected" class="sub">Équipe : HB United</div>
<button id="startBtn" class="btn">⚽ Lancer un match</button>
<button id="lineupBtn" class="btn">📋 Composition</button>
<button id="teamBtn" class="btn">🏆 Choisir une équipe</button>
<button id="careerBtn" class="btn">📈 Mode Carrière</button>
</div>
<div id="hud" class="hidden"><span id="teamName">HB UNITED</span> <span id="scoreA">0</span> — <span id="scoreB">0</span> ATLAS FC · <span id="clock">01:30</span></div>
<button id="pause" class="btn hidden">⏸ Pause</button>
<div id="help" class="hidden">WASD / ZQSD · ESPACE sprint · J tir · K passe · R remplacements · ÉCHAP pause</div>
<div id="staminaBox" class="hidden"><div id="staminaLabel">⚡ Endurance : <b id="staminaText">100%</b></div><div id="staminaBar"><div id="staminaFill"></div></div></div>
<div id="minimap" class="hidden"><div class="half"></div><div class="box" style="left:0"></div><div class="box" style="right:0"></div><div id="mapDots"></div></div>
<div id="subMenu" class="hidden"><h2>🔄 Remplacements</h2><p>Choisis un titulaire à sortir :</p><div id="starterList"></div><p>Choisis ensuite un remplaçant :</p><div id="benchList"></div><button id="closeSubs" class="btn">Fermer</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const $=id=>document.getElementById(id);
const menu=$('menu'),hud=$('hud'),pauseBtn=$('pause'),help=$('help'),staminaBox=$('staminaBox'),minimap=$('minimap'),subMenu=$('subMenu');
const selected=$('selected'),teamName=$('teamName'),scoreAEl=$('scoreA'),scoreBEl=$('scoreB'),clock=$('clock'),staminaFill=$('staminaFill'),staminaText=$('staminaText'),mapDots=$('mapDots');

let scene,camera,renderer,player,ball,keeperA,keeperB;
let running=false,paused=false,finished=false,timeLeft=90,scoreA=0,scoreB=0,kickCooldown=0,subOut=null,stamina=100;
const keys={},teammates=[],enemies=[];
let selectedTeam=localStorage.getItem('hb_selected_team')||'HB United';
let savedLineup=JSON.parse(localStorage.getItem('hb_lineup')||'null')||['Yanis Bensaid','Adam El Mansouri','Ilyas Rahmani','Nabil Kaddouri','Sami Amrani','Omar Belkacem','Ismail Azzouzi','Rayan Haddad','Anas El Fassi','Youssef Karim','Mehdi Saidi'];
let bench=JSON.parse(localStorage.getItem('hb_bench')||'null')||['Nadir Amrani','Sofiane Rami','Yassine Tazi','Bilal Haddou'];
selected.textContent='Équipe : '+selectedTeam;teamName.textContent=selectedTeam.toUpperCase();

function makePlayer(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.3,5,10),new THREE.MeshStandardMaterial({color}));body.position.y=1.2;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,16),new THREE.MeshStandardMaterial({color:0xf0c29a}));head.position.y=2.45;g.add(head);return g}
function makeKeeper(color){const g=makePlayer(color);g.scale.set(1.15,1.15,1.15);return g}

function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9d9);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x315020,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,35,10);scene.add(sun);
 scene.add(new THREE.Mesh(new THREE.BoxGeometry(90,.3,55),new THREE.MeshStandardMaterial({color:0x25853d})));
 const line=new THREE.MeshBasicMaterial({color:0xffffff});const bar=(x,z,w,d)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),line);m.position.set(x,.18,z);scene.add(m)};
 bar(0,0,.12,55);bar(-45,0,.12,55);bar(45,0,.12,55);bar(0,-27.5,90,.12);bar(0,27.5,90,.12);
 const positions=[[-20,0],[-16,-10],[-16,10],[-10,-7],[-10,7],[-5,-12],[-5,12],[0,-6],[0,6],[6,-9],[6,9]];
 savedLineup.slice(0,11).forEach((name,i)=>{const p=makePlayer(0x32a8ff);p.position.set(positions[i][0],.8,positions[i][1]);p.userData.name=name;p.userData.role=i<5?'DEF':i<8?'MID':'ATT';scene.add(p);teammates.push(p);if(i===0)player=p});
 [[20,-12],[25,0],[20,12],[8,8],[8,-8],[28,-8],[28,8],[15,4],[15,-4]].forEach((q,i)=>{const e=makePlayer(0xef4d55);e.position.set(q[0],.8,q[1]);e.userData.role=i<5?'DEF':i<7?'MID':'ATT';scene.add(e);enemies.push(e)});
 keeperA=makeKeeper(0x32a8ff);keeperA.position.set(-42,.8,0);scene.add(keeperA);keeperB=makeKeeper(0xef4d55);keeperB.position.set(42,.8,0);scene.add(keeperB);
 ball=new THREE.Mesh(new THREE.SphereGeometry(.7,20,20),new THREE.MeshStandardMaterial({color:0xffffff}));ball.position.set(-12,.9,0);scene.add(ball);
 animate();
}
function resetBall(){ball.position.set(-12,.9,0);player.position.set(-20,.8,0);kickCooldown=0}
function updateStamina(){stamina=Math.max(0,Math.min(100,stamina));staminaFill.style.width=stamina+'%';staminaText.textContent=Math.round(stamina)+'%';staminaFill.style.background=stamina<20?'#e74c3c':stamina<50?'#f1c40f':'#43d36b'}
function startMatch(){
 menu.classList.add('hidden');hud.classList.remove('hidden');pauseBtn.classList.remove('hidden');help.classList.remove('hidden');minimap.classList.remove('hidden');staminaBox.classList.remove('hidden');
 running=true;paused=false;finished=false;timeLeft=90;scoreA=0;scoreB=0;stamina=100;scoreAEl.textContent='0';scoreBEl.textContent='0';clock.textContent='01:30';pauseBtn.textContent='⏸ Pause';updateStamina();resetBall();
}
function togglePause(){if(!running||finished)return;paused=!paused;pauseBtn.textContent=paused?'▶ Reprendre':'⏸ Pause'}
function goal(team){if(finished)return;if(team==='A')scoreA++;else scoreB++;scoreAEl.textContent=scoreA;scoreBEl.textContent=scoreB;resetBall()}
function finishMatch(){
 if(finished)return;finished=true;running=false;
 const result=scoreA>scoreB?'win':scoreA<scoreB?'loss':'draw';let c=JSON.parse(localStorage.getItem('hb_career')||'null');
 if(c&&c.started){c.played=(c.played||0)+1;if(result==='win'){c.wins=(c.wins||0)+1;c.points=(c.points||0)+3;c.budget=(c.budget||1e7)+5e5;c.rep=Math.min(100,(c.rep||50)+2)}else if(result==='draw'){c.draws=(c.draws||0)+1;c.points=(c.points||0)+1;c.budget=(c.budget||1e7)+15e4}else{c.losses=(c.losses||0)+1;c.budget=Math.max(0,(c.budget||1e7)-1e5);c.rep=Math.max(0,(c.rep||50)-1)}localStorage.setItem('hb_career',JSON.stringify(c))}
 alert('🏁 FIN DU MATCH\n'+selectedTeam+' '+scoreA+' — '+scoreB+' Atlas FC');menu.classList.remove('hidden');hud.classList.add('hidden');pauseBtn.classList.add('hidden');help.classList.add('hidden');minimap.classList.add('hidden');staminaBox.classList.add('hidden');subMenu.classList.add('hidden');
}
function openSubs(){if(!running||finished)return;paused=true;pauseBtn.textContent='▶ Reprendre';renderSubs();subMenu.classList.remove('hidden')}
function closeSubs(){subMenu.classList.add('hidden');subOut=null;if(running&&!finished){paused=false;pauseBtn.textContent='⏸ Pause'}}
function renderSubs(){starterList.innerHTML=savedLineup.map((n,i)=>'<div class="playerRow" data-out="'+i+'">👤 '+n+(i===0?' ⭐ Joueur contrôlé':'')+'</div>').join('');benchList.innerHTML=bench.map((n,i)=>'<div class="playerRow" data-in="'+i+'">🔄 '+n+'</div>').join('')}
function chooseOut(i){subOut=i;renderSubs();alert('Sortie sélectionnée : '+savedLineup[i]+'. Choisis maintenant un remplaçant.')}
function chooseIn(i){if(subOut===null){alert('Choisis d’abord le joueur à sortir.');return}const out=savedLineup[subOut],incoming=bench[i];savedLineup[subOut]=incoming;bench[i]=out;localStorage.setItem('hb_lineup',JSON.stringify(savedLineup));localStorage.setItem('hb_bench',JSON.stringify(bench));teammates[subOut].userData.name=incoming;closeSubs()}
function updateStaminaLogic(){const sprint=keys[' '];if(sprint&&(keys.w||keys.z||keys.s||keys.a||keys.q||keys.d))stamina-=.32;else stamina+=.12;updateStamina()}
function mapPos(x,z){return{left:((x+45)/90*100)+'%',top:((z+27.5)/55*100)+'%'}}
function updateMinimap(){if(!running)return;let html='';teammates.forEach(p=>{const q=mapPos(p.position.x,p.position.z);html+='<span class="dot blue" style="left:'+q.left+';top:'+q.top+'"></span>'});enemies.forEach(p=>{const q=mapPos(p.position.x,p.position.z);html+='<span class="dot red" style="left:'+q.left+';top:'+q.top+'"></span>'});[keeperA,keeperB].forEach(p=>{const q=mapPos(p.position.x,p.position.z);html+='<span class="dot blue" style="left:'+q.left+';top:'+q.top+'"></span>'});const q=mapPos(ball.position.x,ball.position.z);html+='<span class="dot white" style="left:'+q.left+';top:'+q.top+'"></span>';mapDots.innerHTML=html}
function moveToward(o,x,z,s){const dx=x-o.position.x,dz=z-o.position.z,l=Math.hypot(dx,dz)||1;o.position.x+=dx/l*s;o.position.z+=dz/l*s}
function aiStep(){const bx=ball.position.x,bz=ball.position.z;teammates.slice(1).forEach((p,i)=>{let tx=player.position.x+3+(i%3)*2,tz=player.position.z+(i%5-2)*3;if(Math.hypot(bx-p.position.x,bz-p.position.z)<8){tx=bx+(i%2?3:-3);tz=bz+(i%3-1)*3}moveToward(p,Math.max(-38,Math.min(35,tx)),Math.max(-22,Math.min(22,tz)),.045)});enemies.forEach((e,i)=>{let tx=bx,tz=bz;if(e.userData.role==='DEF'){tx=Math.max(5,bx-4);tz=bz+(i%3-1)*5}else if(e.userData.role==='ATT'){tx=Math.min(36,bx+5);tz=bz+(i%2?4:-4)}moveToward(e,tx,tz,.055);if(Math.hypot(e.position.x-bx,e.position.z-bz)<2.2&&bx<38){ball.position.x+=.08;ball.position.z+=(bz-e.position.z)*.12}});moveToward(keeperB,42,Math.max(-6,Math.min(6,bz)),.08);moveToward(keeperA,-42,Math.max(-6,Math.min(6,bz)),.07)}
function playerActions(){const sprint=keys[' ']&&stamina>1,s=sprint?.22:.11;if(keys.w||keys.z)player.position.z-=s;if(keys.s)player.position.z+=s;if(keys.a||keys.q)player.position.x-=s;if(keys.d)player.position.x+=s;player.position.x=Math.max(-41,Math.min(41,player.position.x));player.position.z=Math.max(-23,Math.min(23,player.position.z));const dx=player.position.x-ball.position.x,dz=player.position.z-ball.position.z,dist=Math.hypot(dx,dz);if(dist<3){if(keys.j&&kickCooldown<=0){ball.position.x+=sprint?4.5:2.7;ball.position.z+=dz*.18;kickCooldown=.45}else if(keys.k&&kickCooldown<=0){const mate=teammates.slice(1).reduce((a,p)=>Math.hypot(p.position.x-player.position.x,p.position.z-player.position.z)<Math.hypot(a.position.x-player.position.x,a.position.z-player.position.z)?p:a);const px=mate.position.x-player.position.x,pz=mate.position.z-player.position.z,l=Math.hypot(px,pz)||1;ball.position.x+=px/l*4;ball.position.z+=pz/l*4;kickCooldown=.4}}if(kickCooldown>0)kickCooldown-=.016}
function animate(){requestAnimationFrame(animate);if(running&&!paused){updateStaminaLogic();playerActions();aiStep();if(ball.position.x>43&&Math.abs(ball.position.z)<7)goal('A');if(ball.position.x<-43&&Math.abs(ball.position.z)<7)goal('B');ball.position.x=Math.max(-44,Math.min(44,ball.position.x));ball.position.z=Math.max(-26,Math.min(26,ball.position.z));camera.position.set(player.position.x-13,18,player.position.z+22);camera.lookAt(player.position.x,0,player.position.z)}updateMinimap();renderer.render(scene,camera)}

$('startBtn').addEventListener('click',startMatch);pauseBtn.addEventListener('click',togglePause);$('lineupBtn').addEventListener('click',()=>location.href='lineup.html');$('teamBtn').addEventListener('click',()=>location.href='team-selection.html');$('careerBtn').addEventListener('click',()=>location.href='career.html');$('closeSubs').addEventListener('click',closeSubs);
$('starterList').addEventListener('click',e=>{const row=e.target.closest('[data-out]');if(row)chooseOut(Number(row.dataset.out))});$('benchList').addEventListener('click',e=>{const row=e.target.closest('[data-in]');if(row)chooseIn(Number(row.dataset.in))});
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&running)togglePause();if(e.key.toLowerCase()==='r')openSubs()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setInterval(()=>{if(running&&!paused&&timeLeft>0){timeLeft--;clock.textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(timeLeft%60).padStart(2,'0');if(timeLeft===0)finishMatch()}},1000);
init();
</script>
</body>
</html>
