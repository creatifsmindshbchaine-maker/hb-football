<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Football 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07110a;font-family:Arial;color:white}#menu{position:fixed;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#174d2b,#050906)}h1{font-size:64px;letter-spacing:6px;margin:0 0 8px}.sub{opacity:.75;margin-bottom:28px}.btn{background:#164b29;color:white;border:1px solid #62b779;border-radius:10px;padding:13px 22px;margin:5px;font-size:16px;cursor:pointer}.btn:hover{background:#246f3d}#hud{position:fixed;z-index:4;top:15px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#07110dcc;border-radius:10px;font-weight:bold}#help{position:fixed;z-index:4;bottom:14px;left:50%;transform:translateX(-50%);background:#07110dcc;padding:9px 15px;border-radius:8px;font-size:13px}#pause{position:fixed;z-index:6;right:15px;top:15px}.hidden{display:none!important}</style></head><body><div id="menu"><h1>HB FOOTBALL</h1><div class="sub">Prototype 3D — gardiens et tirs</div><button class="btn" onclick="start()">⚽ Lancer un match</button><button class="btn" onclick="alert('WASD / ZQSD déplacer · Espace sprint · J tir · K passe · Échap pause')">🎮 Commandes</button><button class="btn" onclick="alert('HB United · Atlas FC · Ocean FC')">🏆 Équipes</button></div><div id="hud" class="hidden">HB UNITED <span id="scoreA">0</span> — <span id="scoreB">0</span> ATLAS FC · <span id="clock">01:30</span></div><button id="pause" class="btn hidden" onclick="togglePause()">⏸ Pause</button><div id="help" class="hidden">WASD / ZQSD · ESPACE sprint · J tir · K passe · ÉCHAP pause</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';let scene,camera,renderer,player,ball,keeperA,keeperB,keys={},running=false,paused=false,t=90,scoreA=0,scoreB=0,kickCooldown=0;const enemies=[];function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9d9);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x315020,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);const grass=new THREE.Mesh(new THREE.BoxGeometry(90,.3,55),new THREE.MeshStandardMaterial({color:0x25853d}));grass.receiveShadow=true;scene.add(grass);const line=new THREE.MeshBasicMaterial({color:0xffffff});function bar(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),line);m.position.set(x,.18,z);scene.add(m)}bar(0,0,.12,55);bar(-45,0,.12,55);bar(45,0,.12,55);bar(0,-27.5,90,.12);bar(0,27.5,90,.12);bar(0,0,.12,55);for(const x of [-45,45]){for(const z of [-7,7])bar(x,z,4,.12);bar(x,0,.12,14)}const circle=new THREE.Mesh(new THREE.RingGeometry(8.8,9,.01,64),line);circle.rotation.x=-Math.PI/2;circle.position.y=.2;scene.add(circle);for(let i=-2;i<=2;i++){const p=makePlayer(0x32a8ff);p.position.set(-20,.8,i*5);scene.add(p);if(i===0)player=p}[[20,-12],[25,0],[20,12],[8,8]].forEach(q=>{const e=makePlayer(0xef4d55);e.position.set(q[0],.8,q[1]);scene.add(e);enemies.push(e)});keeperA=makeKeeper(0x32a8ff);keeperA.position.set(-42,.8,0);scene.add(keeperA);keeperB=makeKeeper(0xef4d55);keeperB.position.set(42,.8,0);scene.add(keeperB);ball=new THREE.Mesh(new THREE.SphereGeometry(.7,20,20),new THREE.MeshStandardMaterial({color:0xffffff}));ball.position.set(-12,.9,0);ball.castShadow=true;scene.add(ball);buildStands();animate()}function makePlayer(c){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.3,5,10),new THREE.MeshStandardMaterial({color:c}));body.position.y=1.2;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,16),new THREE.MeshStandardMaterial({color:0xf0c29a}));head.position.y=2.45;head.castShadow=true;g.add(head);return g}function makeKeeper(c){const g=makePlayer(c);g.scale.set(1.15,1.15,1.15);return g}function buildStands(){for(const z of [-34,34]){const stand=new THREE.Mesh(new THREE.BoxGeometry(100,5,6),new THREE.MeshStandardMaterial({color:0x263238}));stand.position.set(0,2.5,z);scene.add(stand)}}function resetBall(){ball.position.set(-12,.9,0);player.position.set(-20,.8,0);kickCooldown=0}function goal(team){if(team==='A')scoreA++;else scoreB++;scoreAEl.textContent=scoreA;scoreBEl.textContent=scoreB;alert('⚽ BUT ! '+(team==='A'?'HB United':'Atlas FC'));resetBall()}function start(){menu.classList.add('hidden');hud.classList.remove('hidden');pause.classList.remove('hidden');help.classList.remove('hidden');running=true;paused=false;t=90;scoreA=0;scoreB=0;scoreAEl.textContent=0;scoreBEl.textContent=0;clock.textContent='01:30';resetBall()}function togglePause(){paused=!paused;pause.textContent=paused?'▶ Reprendre':'⏸ Pause'}document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&running)togglePause()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setInterval(()=>{if(running&&!paused&&t>0){t--;clock.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t===0)alert('🏁 Fin du match !')}} ,1000);function animate(){requestAnimationFrame(animate);if(running&&!paused){const s=keys[' ']?.22:.11;if(keys.w||keys.z)player.position.z-=s;if(keys.s)player.position.z+=s;if(keys.a||keys.q)player.position.x-=s;if(keys.d)player.position.x+=s;player.position.x=Math.max(-41,Math.min(41,player.position.x));player.position.z=Math.max(-23,Math.min(23,player.position.z));const dx=player.position.x-ball.position.x,dz=player.position.z-ball.position.z;if(Math.hypot(dx,dz)<3){if(keys.j&&kickCooldown<=0){const power=keys[' ']?.42:.28;ball.position.x+=power*10;ball.position.z+=dz*.12;kickCooldown=.5}else if(keys.k&&kickCooldown<=0){ball.position.x+=1.5;kickCooldown=.25}}if(kickCooldown>0)kickCooldown-=.016;enemies.forEach(e=>{const dx=ball.position.x-e.position.x,dz=ball.position.z-e.position.z,l=Math.hypot(dx,dz)||1;e.position.x+=dx/l*.035;e.position.z+=dz/l*.035});keeperA.position.z+=(Math.max(-7,Math.min(7,ball.position.z))-keeperA.position.z)*.035;keeperB.position.z+=(Math.max(-7,Math.min(7,ball.position.z))-keeperB.position.z)*.06;if(Math.hypot(ball.position.x-keeperB.position.x,ball.position.z-keeperB.position.z)<2.5)ball.position.x-=Math.sign(ball.position.x-keeperB.position.x)*1.8;if(Math.hypot(ball.position.x-keeperA.position.x,ball.position.z-keeperA.position.z)<2.5)ball.position.x+=Math.sign(keeperA.position.x-ball.position.x)*1.8;if(ball.position.x>43&&Math.abs(ball.position.z)<7)goal('A');if(ball.position.x<-43&&Math.abs(ball.position.z)<7)goal('B');ball.position.x=Math.max(-44,Math.min(44,ball.position.x));ball.position.z=Math.max(-26,Math.min(26,ball.position.z));camera.position.set(player.position.x-13,18,player.position.z+22);camera.lookAt(player.position.x,0,player.position.z)}renderer.render(scene,camera)}const scoreAEl=document.getElementById('scoreA'),scoreBEl=document.getElementById('scoreB');init();</script></body></html>
