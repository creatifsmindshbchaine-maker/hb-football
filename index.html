<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HB Football</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07130c;color:white;font-family:Arial,sans-serif;overflow:hidden}#app{height:100vh;display:flex;align-items:center;justify-content:center}.screen{text-align:center;width:min(1100px,94vw)}h1{font-size:64px;margin:0 0 10px;letter-spacing:4px}.sub{opacity:.75;margin-bottom:30px}.menu{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.menu button,button{background:#173b25;color:#fff;border:1px solid #4f8c5e;border-radius:10px;padding:14px 20px;font-size:16px;cursor:pointer}.menu button:hover,button:hover{background:#245d35}#game{position:relative;width:min(1100px,94vw);height:min(650px,82vh);background:#268344;border:8px solid #ddd;box-shadow:0 0 40px #000}.field{position:absolute;inset:5%;border:3px solid #fff}.mid{position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #fff}.circle{position:absolute;width:150px;height:150px;border:3px solid #fff;border-radius:50%;left:calc(50% - 75px);top:calc(50% - 75px)}.box{position:absolute;top:35%;height:30%;width:15%;border:3px solid #fff}.box.left{left:0}.box.right{right:0}.player,.ball{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}.player{width:25px;height:25px;background:#35a7ff;border:2px solid white}.player.enemy{background:#ef5350}.ball{width:15px;height:15px;background:#fff;border:2px solid #222}#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#07130ccc;padding:10px 20px;border-radius:10px;font-weight:bold;z-index:5}.help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#07130ccc;padding:8px 14px;border-radius:8px;font-size:13px;z-index:5}#back{position:absolute;right:12px;top:12px;z-index:10}.hidden{display:none}
</style></head><body><div id="app"><div id="home" class="screen"><h1>HB FOOTBALL</h1><div class="sub">Le football commence ici</div><div class="menu"><button onclick="startGame()">⚽ Mode Match</button><button onclick="alert('ZQSD/WASD déplacer • Espace sprint • J tirer • K passer • Échap pause')">🎮 Commandes</button><button onclick="alert('IA adverse : prototype en cours')">🤖 IA adverse</button><button onclick="alert('HB United • Atlas FC • Ocean FC')">🏆 Équipes</button><button onclick="alert('Joueurs et statistiques : bientôt')">👤 Joueurs</button><button onclick="alert('Carrière : bientôt')">📈 Carrière</button></div></div><div id="game" class="hidden"><div id="hud">HB UNITED 0 - 0 ATLAS FC &nbsp; <span id="time">01:30</span></div><button id="back" onclick="endGame()">Menu</button><div class="field"><div class="mid"></div><div class="circle"></div><div class="box left"></div><div class="box right"></div><div id="me" class="player" style="left:30%;top:50%"></div><div class="player enemy" style="left:68%;top:42%"></div><div class="player enemy" style="left:72%;top:58%"></div><div class="player" style="left:24%;top:35%"></div><div class="player" style="left:25%;top:65%"></div><div id="ball" class="ball" style="left:34%;top:50%"></div></div><div class="help">WASD / ZQSD = déplacement · ESPACE = sprint · J = tir · K = passe · ÉCHAP = menu</div></div></div><script>
let keys={},running=false,x=30,y=50,ballX=34,ballY=50,seconds=90;document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')endGame()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function startGame(){home.classList.add('hidden');game.classList.remove('hidden');running=true;seconds=90;requestAnimationFrame(loop)}function endGame(){running=false;game.classList.add('hidden');home.classList.remove('hidden')}
function loop(){if(!running)return;let s=keys[' ']?.18:.09;if(keys['w']||keys['z'])y-=s;if(keys['s'])y+=s;if(keys['a']||keys['q'])x-=s;if(keys['d'])x+=s;x=Math.max(7,Math.min(93,x));y=Math.max(7,Math.min(93,y));me.style.left=x+'%';me.style.top=y+'%';if(keys['j']){ballX=Math.min(95,ballX+.35);ballY=y;ball.style.left=ballX+'%';ball.style.top=ballY+'%'}else{let dx=x-ballX,dy=y-ballY;if(Math.hypot(dx,dy)<6){ballX+=dx*.04;ballY+=dy*.04;ball.style.left=ballX+'%';ball.style.top=ballY+'%'}}requestAnimationFrame(loop)}setInterval(()=>{if(running&&seconds>0){seconds--;let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');time.textContent=m+':'+s}},1000);
</script></body></html>
