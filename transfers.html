<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Football — Transferts</title><style>body{margin:0;background:#07130c;color:#fff;font-family:Arial}.wrap{max-width:1050px;margin:auto;padding:25px}h1{text-align:center}.panel,.card{background:#12261a;border:1px solid #376b45;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{margin:0}.stat{font-size:20px;font-weight:bold}.muted{opacity:.7}.btn{background:#1d6031;color:#fff;border:1px solid #62b779;border-radius:9px;padding:10px 15px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}</style></head><body><div class="wrap"><h1>💰 MARCHÉ DES TRANSFERTS</h1><div class="panel top"><div>🏟️ <b id="club"></b></div><div>💰 Budget : <b id="budget"></b></div></div><div class="panel"><h2>👤 Joueurs disponibles</h2><div id="players" class="grid"></div></div><div class="panel"><h2>📋 Mes recrues</h2><div id="owned">Aucun transfert.</div><button class="btn" onclick="location.href='career.html'">📈 Retour carrière</button></div></div><script>const market=[['Nadir Amrani','ATT',84,4200000],['Sofiane Rami','MID',82,3500000],['Yassine Tazi','DEF',80,2900000],['Bilal Haddou','GK',81,3100000],['Mehdi Fadili','ATT',87,6500000],['Othmane Berrada','MID',79,2400000],['Anas Ziani','DEF',83,3900000],['Karim Ait Ali','ATT',80,3300000],['Rayan Chafai','MID',85,5100000],['Ilyas Nouri','DEF',77,1800000]];let c=JSON.parse(localStorage.getItem('hb_career')||'null')||{club:localStorage.getItem('hb_selected_team')||'HB United',budget:10000000,rep:50,owned:[]};c.owned=c.owned||[];function money(n){return '€'+(n/1000000).toFixed(1)+'M'}function save(){localStorage.setItem('hb_career',JSON.stringify(c))}function render(){club.textContent=c.club;budget.textContent=money(c.budget);players.innerHTML=market.map((p,i)=>{let bought=c.owned.includes(p[0]);return '<div class="card"><h3>'+p[0]+'</h3><div>'+p[1]+' · ⭐ '+p[2]+'</div><p>💰 '+money(p[3])+'</p><button class="btn" '+(bought||c.budget<p[3]?'disabled':'')+' onclick="buy('+i+')">'+(bought?'✅ Recruté':'💰 Acheter')+'</button></div>'}).join('');owned.innerHTML=c.owned.length?c.owned.map(n=>'👤 '+n).join('<br>'):'Aucun transfert.'}function buy(i){let p=market[i];if(c.budget<p[3]||c.owned.includes(p[0]))return;c.budget-=p[3];c.owned.push(p[0]);c.rep=Math.min(100,(c.rep||50)+1);save();render();alert('✅ '+p[0]+' rejoint '+c.club+' !')}render();</script></body></html>
