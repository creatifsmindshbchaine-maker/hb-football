<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HB Football — Composition</title><style>body{margin:0;background:#07130c;color:#fff;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:25px}.panel{background:#12261a;border:1px solid #376b45;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.card{padding:12px;border:1px solid #315c3c;border-radius:10px;background:#0d1f14}.btn{background:#1d6031;color:#fff;border:1px solid #62b779;border-radius:9px;padding:11px 16px;cursor:pointer;margin:4px}.tag{opacity:.7}.selected{border-color:#8ee69d;background:#183d25}.small{font-size:13px;opacity:.7}</style></head><body><div class="wrap"><h1>📋 HB FOOTBALL — COMPOSITION</h1><div class="panel"><h2 id="club"></h2><p class="small">Clique sur un joueur pour le mettre titulaire. Les 11 premiers sélectionnés démarrent le prochain match.</p><div id="count"></div><div id="players" class="grid"></div><button class="btn" onclick="saveLineup()">💾 Enregistrer la composition</button><button class="btn" onclick="location.href='career.html'">📈 Retour carrière</button></div></div><script>const base=['Yanis Bensaid|GK|78','Adam El Mansouri|DEF|80','Ilyas Rahmani|DEF|79','Nabil Kaddouri|DEF|77','Sami Amrani|DEF|76','Omar Belkacem|MID|81','Rayan Haddad|MID|83','Ismail Azzouzi|MID|78','Anas El Fassi|ATT|82','Youssef Karim|ATT|85','Mehdi Saidi|ATT|80'];const market=[['Nadir Amrani','ATT',84],['Sofiane Rami','MID',82],['Yassine Tazi','DEF',80],['Bilal Haddou','GK',81],['Mehdi Fadili','ATT',87],['Othmane Berrada','MID',79],['Anas Ziani','DEF',83],['Karim Ait Ali','ATT',80],['Rayan Chafai','MID',85],['Ilyas Nouri','DEF',77]];let c=JSON.parse(localStorage.getItem('hb_career')||'null')||{club:'HB United',owned:[]};let players=base.map(x=>{let [name,pos,r]=x.split('|');return{name,pos,r:+r}});(c.owned||[]).forEach(n=>{let p=market.find(x=>x[0]===n);if(p)players.push({name:p[0],pos:p[1],r:p[2]})});let lineup=JSON.parse(localStorage.getItem('hb_lineup')||'null')||players.slice(0,11).map(p=>p.name);club.textContent=c.club;function render(){count.textContent='⭐ '+lineup.length+'/11 titulaires';playersEl=players.map((p,i)=>{let on=lineup.includes(p.name);return '<div class="card '+(on?'selected':'')+'" onclick="toggle('+i+')"><b>'+p.name+'</b><br><span class="tag">'+p.pos+' · ⭐ '+p.r+'</span><br><span class="small">'+(on?'Titulaire':'Remplaçant')+'</span></div>'}).join('');players.innerHTML=playersEl}function toggle(i){let n=players[i].name;if(lineup.includes(n))lineup=lineup.filter(x=>x!==n);else if(lineup.length<11)lineup.push(n);render()}function saveLineup(){if(lineup.length!==11){alert('Choisis exactement 11 titulaires.');return}localStorage.setItem('hb_lineup',JSON.stringify(lineup));alert('✅ Composition enregistrée !');}render();</script></body></html>
